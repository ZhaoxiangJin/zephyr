<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 920" role="img" aria-labelledby="title desc">
  <title id="title">Zephyr eBPF subsystem architecture</title>
  <desc id="desc">System architecture diagram showing separate tracing and PM event sources, a shared eBPF runtime hub, an explicit control plane, and application-side integration.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#294157" />
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .frame { fill: none; stroke: #d7dee7; stroke-width: 1.5; }
      .panel { stroke-width: 1.5; }
      .panel-kernel { fill: #fcfaf6; stroke: #d6cab8; }
      .panel-runtime { fill: #fbfcfe; stroke: #ced8e3; }
      .panel-control { fill: #fcfaf6; stroke: #d6cab8; }
      .panel-app { fill: #f9fbfe; stroke: #d3dae3; }
      .panel-divider { stroke: #dde4ed; stroke-width: 1; }
      .panel-title { fill: #243447; font: 600 18px Cambria, "Times New Roman", serif; letter-spacing: 0.2px; }
      .panel-subtitle { fill: #627389; font: 16px "Segoe UI", Arial, sans-serif; }
      .section-tag { stroke-width: 0; }
      .section-tag-runtime { fill: #e5eef9; }
      .section-tag-control { fill: #efe7d7; }
      .section-tag-data { fill: #e5efe3; }
      .section-tag-text { font: 600 11px "Segoe UI", Arial, sans-serif; letter-spacing: 0.8px; }
      .section-tag-text-runtime { fill: #35597a; }
      .section-tag-text-control { fill: #6f5b30; }
      .section-tag-text-data { fill: #496548; }
      .card { stroke-width: 1.7; }
      .card-kernel { fill: #fffdfa; stroke: #c6a582; }
      .card-runtime { fill: #f8fbff; stroke: #8ea9c4; }
      .card-data { fill: #f6faf5; stroke: #91a88d; }
      .card-control { fill: #fbfaf6; stroke: #b7a47b; }
      .card-app { fill: #f7f9fc; stroke: #93a6bb; }
      .card-title { fill: #243447; font: 600 19px "Segoe UI", Arial, sans-serif; }
      .card-meta { fill: #66768a; font: 13px Consolas, "Courier New", monospace; }
      .badge { stroke-width: 0; }
      .badge-kernel { fill: #f1e5d9; }
      .badge-runtime { fill: #e5eef9; }
      .badge-data { fill: #e5efe3; }
      .badge-control { fill: #efe7d7; }
      .badge-app { fill: #e8edf4; }
      .badge-text { font: 600 11px "Segoe UI", Arial, sans-serif; letter-spacing: 0.8px; }
      .badge-text-kernel { fill: #7a5c3c; }
      .badge-text-runtime { fill: #35597a; }
      .badge-text-data { fill: #496548; }
      .badge-text-control { fill: #6f5b30; }
      .badge-text-app { fill: #495d73; }
      .edge { stroke: #294157; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
      .edge-dashed { stroke-dasharray: 7 6; }
      .connector-label { fill: #ffffff; stroke: #d7dee7; stroke-width: 1; }
      .connector-label-text { fill: #45586f; font: 12.5px "Segoe UI", Arial, sans-serif; }
      .caption { fill: #5f7187; font: 15px "Segoe UI", Arial, sans-serif; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1680" height="920" rx="20" ry="20" />
  <rect class="frame" x="12" y="12" width="1656" height="896" rx="18" ry="18" />
<rect class="panel panel-kernel" x="44" y="58" width="286" height="500" rx="22" ry="22" />
<line class="panel-divider" x1="44" y1="114" x2="330" y2="114" />
<text class="panel-title" x="62" y="88" text-anchor="start"><tspan x="62" dy="0">Zephyr Kernel Event Sources</tspan></text>
<text class="panel-subtitle" x="62" y="140" text-anchor="start"><tspan x="62" dy="0">Tracing hooks and PM notifiers stay</tspan><tspan x="62" dy="16">separate here. They only converge</tspan><tspan x="62" dy="16">after backend-specific callbacks are</tspan><tspan x="62" dy="16">translated into the common eBPF</tspan><tspan x="62" dy="16">target model.</tspan></text>
<rect class="panel panel-runtime" x="362" y="58" width="938" height="500" rx="22" ry="22" />
<line class="panel-divider" x1="362" y1="114" x2="1300" y2="114" />
<text class="panel-title" x="380" y="88" text-anchor="start"><tspan x="380" dy="0">Common eBPF Runtime</tspan></text>
<text class="panel-subtitle" x="380" y="140" text-anchor="start"><tspan x="380" dy="0">A shared runtime hub validates targets, finds enabled programs, executes them in the VM, and exposes controlled services and</tspan><tspan x="380" dy="16">persistent state.</tspan></text>
<rect class="panel panel-app" x="1332" y="58" width="304" height="820" rx="22" ry="22" />
<line class="panel-divider" x1="1332" y1="114" x2="1636" y2="114" />
<text class="panel-title" x="1350" y="88" text-anchor="start"><tspan x="1350" dy="0">Application Integration</tspan></text>
<text class="panel-subtitle" x="1350" y="140" text-anchor="start"><tspan x="1350" dy="0">Static program and map definitions</tspan><tspan x="1350" dy="16">enter through the public API.</tspan><tspan x="1350" dy="16">Application logic, shell commands, and</tspan><tspan x="1350" dy="16">tests consume state exported through</tspan><tspan x="1350" dy="16">maps or ring buffers.</tspan></text>
<rect class="panel panel-control" x="362" y="602" width="938" height="276" rx="22" ry="22" />
<line class="panel-divider" x1="362" y1="658" x2="1300" y2="658" />
<text class="panel-title" x="380" y="632" text-anchor="start"><tspan x="380" dy="0">Program Control Plane</tspan></text>
<text class="panel-subtitle" x="380" y="684" text-anchor="start"><tspan x="380" dy="0">Program lifecycle management stays off the hot event path. Each attach starts one session, and verification gates enablement for</tspan><tspan x="380" dy="16">that session.</tspan></text>
<rect class="section-tag section-tag-runtime" x="388" y="140" width="92" height="28" rx="14" ry="14" />
<text class="section-tag-text section-tag-text-runtime" x="434" y="159" text-anchor="middle"><tspan x="434" dy="0">event plane</tspan></text>
<rect class="section-tag section-tag-control" x="388" y="640" width="97.39999999999999" height="28" rx="14" ry="14" />
<text class="section-tag-text section-tag-text-control" x="436.7" y="659" text-anchor="middle"><tspan x="436.7" dy="0">control plane</tspan></text>
<rect class="section-tag section-tag-data" x="736" y="418" width="92" height="28" rx="14" ry="14" />
<text class="section-tag-text section-tag-text-data" x="782" y="437" text-anchor="middle"><tspan x="782" dy="0">data plane</tspan></text>
<rect class="card card-kernel" x="72" y="180" width="230" height="122" rx="18" ry="18" />
<rect class="badge badge-kernel" x="88" y="194" width="104.5" height="24" rx="12" ry="12" />
<text class="badge-text badge-text-kernel" x="98" y="210" text-anchor="start"><tspan x="98" dy="0">kernel source</tspan></text>
<text class="card-title card-title-kernel" x="187" y="242" text-anchor="middle"><tspan x="187" dy="0">Tracing Hooks</tspan></text>
<text class="card-meta" x="187" y="279" text-anchor="middle"><tspan x="187" dy="0">scheduler, ISR, idle</tspan><tspan x="187" dy="15">native tracing callbacks</tspan></text>
<rect class="card card-kernel" x="72" y="338" width="230" height="122" rx="18" ry="18" />
<rect class="badge badge-kernel" x="88" y="352" width="104.5" height="24" rx="12" ry="12" />
<text class="badge-text badge-text-kernel" x="98" y="368" text-anchor="start"><tspan x="98" dy="0">kernel source</tspan></text>
<text class="card-title card-title-kernel" x="187" y="400" text-anchor="middle"><tspan x="187" dy="0">PM Notifier</tspan></text>
<text class="card-meta" x="187" y="429" text-anchor="middle"><tspan x="187" dy="0">state entry and exit</tspan><tspan x="187" dy="15">native PM callbacks</tspan></text>
<rect class="card card-runtime" x="414" y="176" width="208" height="122" rx="18" ry="18" />
<rect class="badge badge-runtime" x="430" y="190" width="111" height="24" rx="12" ry="12" />
<text class="badge-text badge-text-runtime" x="440" y="206" text-anchor="start"><tspan x="440" dy="0">backend bridge</tspan></text>
<text class="card-title card-title-runtime" x="518" y="238" text-anchor="middle"><tspan x="518" dy="0">ebpf_tracing</tspan></text>
<text class="card-meta" x="518" y="267" text-anchor="middle"><tspan x="518" dy="0">tracing backend bridge</tspan><tspan x="518" dy="15">hook callback -&gt; target +</tspan><tspan x="518" dy="15">ctx</tspan></text>
<rect class="card card-runtime" x="414" y="338" width="208" height="122" rx="18" ry="18" />
<rect class="badge badge-runtime" x="430" y="352" width="111" height="24" rx="12" ry="12" />
<text class="badge-text badge-text-runtime" x="440" y="368" text-anchor="start"><tspan x="440" dy="0">backend bridge</tspan></text>
<text class="card-title card-title-runtime" x="518" y="400" text-anchor="middle"><tspan x="518" dy="0">ebpf_pm</tspan></text>
<text class="card-meta" x="518" y="429" text-anchor="middle"><tspan x="518" dy="0">PM backend bridge</tspan><tspan x="518" dy="15">notifier callback -&gt;</tspan><tspan x="518" dy="15">target + ctx</tspan></text>
<rect class="card card-runtime" x="688" y="230" width="256" height="176" rx="18" ry="18" />
<rect class="badge badge-runtime" x="704" y="244" width="88" height="24" rx="12" ry="12" />
<text class="badge-text badge-text-runtime" x="714" y="260" text-anchor="start"><tspan x="714" dy="0">shared hub</tspan></text>
<text class="card-title card-title-runtime" x="816" y="292" text-anchor="middle"><tspan x="816" dy="0">ebpf_target</tspan></text>
<text class="card-meta" x="816" y="321" text-anchor="middle"><tspan x="816" dy="0">shared target runtime</tspan><tspan x="816" dy="15">check attach-target validity</tspan><tspan x="816" dy="15">apply prog attach policy and</tspan><tspan x="816" dy="15">fan-out</tspan></text>
<rect class="card card-runtime" x="1012" y="176" width="230" height="122" rx="18" ry="18" />
<rect class="badge badge-runtime" x="1028" y="190" width="88" height="24" rx="12" ry="12" />
<text class="badge-text badge-text-runtime" x="1038" y="206" text-anchor="start"><tspan x="1038" dy="0">execution</tspan></text>
<text class="card-title card-title-runtime" x="1127" y="238" text-anchor="middle"><tspan x="1127" dy="0">ebpf_vm</tspan></text>
<text class="card-meta" x="1127" y="267" text-anchor="middle"><tspan x="1127" dy="0">execution engine</tspan><tspan x="1127" dy="15">fresh stack and registers</tspan><tspan x="1127" dy="15">interpret verified bytecode</tspan></text>
<rect class="card card-runtime" x="1012" y="338" width="230" height="122" rx="18" ry="18" />
<rect class="badge badge-runtime" x="1028" y="352" width="104.5" height="24" rx="12" ry="12" />
<text class="badge-text badge-text-runtime" x="1038" y="368" text-anchor="start"><tspan x="1038" dy="0">service layer</tspan></text>
<text class="card-title card-title-runtime" x="1127" y="400" text-anchor="middle"><tspan x="1127" dy="0">ebpf_helpers</tspan></text>
<text class="card-meta" x="1127" y="429" text-anchor="middle"><tspan x="1127" dy="0">service switchboard</tspan><tspan x="1127" dy="15">helper ID -&gt; runtime service</tspan></text>
<rect class="card card-data" x="738" y="444" width="264" height="96" rx="18" ry="18" />
<rect class="badge badge-data" x="754" y="458" width="98" height="24" rx="12" ry="12" />
<text class="badge-text badge-text-data" x="764" y="474" text-anchor="start"><tspan x="764" dy="0">shared state</tspan></text>
<text class="card-title card-title-data" x="870" y="506" text-anchor="middle"><tspan x="870" dy="0">ebpf_maps</tspan></text>
<text class="card-meta" x="870" y="535" text-anchor="middle"><tspan x="870" dy="0">persistent shared state</tspan><tspan x="870" dy="15">array, hash, ringbuf, per-CPU</tspan><tspan x="870" dy="15">array</tspan></text>
<rect class="card card-control" x="458" y="716" width="286" height="118" rx="18" ry="18" />
<rect class="badge badge-control" x="474" y="730" width="124" height="24" rx="12" ry="12" />
<text class="badge-text badge-text-control" x="484" y="746" text-anchor="start"><tspan x="484" dy="0">runtime API core</tspan></text>
<text class="card-title card-title-control" x="601" y="778" text-anchor="middle"><tspan x="601" dy="0">ebpf_prog</tspan></text>
<text class="card-meta" x="601" y="807" text-anchor="middle"><tspan x="601" dy="0">program lifecycle orchestrator</tspan><tspan x="601" dy="15">attach, detach, enable</tspan><tspan x="601" dy="15">current attachment state</tspan></text>
<rect class="card card-control" x="832" y="716" width="286" height="118" rx="18" ry="18" />
<rect class="badge badge-control" x="848" y="730" width="91.5" height="24" rx="12" ry="12" />
<text class="badge-text badge-text-control" x="858" y="746" text-anchor="start"><tspan x="858" dy="0">safety gate</tspan></text>
<text class="card-title card-title-control" x="975" y="778" text-anchor="middle"><tspan x="975" dy="0">ebpf_verifier</tspan></text>
<text class="card-meta" x="975" y="807" text-anchor="middle"><tspan x="975" dy="0">safety gate</tspan><tspan x="975" dy="15">opcode, jump, helper, stack checks</tspan></text>
<rect class="card card-app" x="1370" y="206" width="228" height="126" rx="18" ry="18" />
<rect class="badge badge-app" x="1386" y="220" width="104.5" height="24" rx="12" ry="12" />
<text class="badge-text badge-text-app" x="1396" y="236" text-anchor="start"><tspan x="1396" dy="0">static inputs</tspan></text>
<text class="card-title card-title-app" x="1484" y="268" text-anchor="middle"><tspan x="1484" dy="0">Program and Map</tspan><tspan x="1484" dy="19">Definitions</tspan></text>
<text class="card-meta" x="1484" y="316" text-anchor="middle"><tspan x="1484" dy="0">EBPF_PROG_DEFINE</tspan><tspan x="1484" dy="15">EBPF_MAP_DEFINE</tspan><tspan x="1484" dy="15">public eBPF headers</tspan></text>
<rect class="card card-app" x="1370" y="434" width="228" height="126" rx="18" ry="18" />
<rect class="badge badge-app" x="1386" y="448" width="91.5" height="24" rx="12" ry="12" />
<text class="badge-text badge-text-app" x="1396" y="464" text-anchor="start"><tspan x="1396" dy="0">normal code</tspan></text>
<text class="card-title card-title-app" x="1484" y="496" text-anchor="middle"><tspan x="1484" dy="0">Consumers and Tools</tspan></text>
<text class="card-meta" x="1484" y="525" text-anchor="middle"><tspan x="1484" dy="0">application logic, shell,</tspan><tspan x="1484" dy="15">tests</tspan><tspan x="1484" dy="15">read counters or ring</tspan><tspan x="1484" dy="15">buffers</tspan></text>
<text class="caption" x="830" y="576" text-anchor="middle"><tspan x="830" dy="0">Separate backend sources converge into one target hub; program lifecycle stays below the event path.</tspan></text>
