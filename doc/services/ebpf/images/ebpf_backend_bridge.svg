<rect class="note note-rose" x="936" y="404" width="430" height="144" rx="20" ry="20" />
<text class="headline" x="52" y="82">Backend bridge model</text>
<text class="subheadline" x="52" y="114" text-anchor="start"><tspan x="52" dy="0">Backends are adapters, not alternate runtimes. Each backend captures native Zephyr events once, translates them into one concrete target plus one</tspan><tspan x="52" dy="18">typed context object, and then reuses the common dispatch path.</tspan></text>
<text class="panel-title" x="70" y="210" text-anchor="start"><tspan x="70" dy="0">Native callback spaces</tspan></text>
<text class="panel-subtitle" x="70" y="260" text-anchor="start"><tspan x="70" dy="0">These are backend-specific capture</tspan><tspan x="70" dy="17">mechanisms owned by Zephyr subsystems</tspan><tspan x="70" dy="17">outside the common eBPF runtime.</tspan></text>
<text class="panel-title" x="454" y="210" text-anchor="start"><tspan x="454" dy="0">Backend translation layer</tspan></text>
<text class="panel-subtitle" x="454" y="260" text-anchor="start"><tspan x="454" dy="0">Each backend bridges native callback arguments</tspan><tspan x="454" dy="17">into the common target and context representation.</tspan></text>
<text class="panel-title" x="892" y="210" text-anchor="start"><tspan x="892" dy="0">Shared runtime entry</tspan></text>
<text class="panel-subtitle" x="892" y="260" text-anchor="start"><tspan x="892" dy="0">Once translation is done, backend-specific logic ends and the common</tspan><tspan x="892" dy="17">runtime owns validation, fan-out, and execution.</tspan></text>
<text class="badge-text badge-text-sand" x="145" y="314" text-anchor="middle"><tspan x="145" dy="0">native</tspan></text>
<text class="card-title" x="222" y="342" text-anchor="middle"><tspan x="222" dy="0">Tracing callbacks</tspan></text>
<text class="card-body" x="222" y="371" text-anchor="middle"><tspan x="222" dy="0">thread in or out, ISR enter or</tspan><tspan x="222" dy="16">exit, idle enter or exit</tspan></text>
<text class="badge-text badge-text-sand" x="145" y="498" text-anchor="middle"><tspan x="145" dy="0">native</tspan></text>
<text class="card-title" x="222" y="526" text-anchor="middle"><tspan x="222" dy="0">PM notifier callbacks</tspan></text>
<text class="card-body" x="222" y="555" text-anchor="middle"><tspan x="222" dy="0">state entry and exit</tspan><tspan x="222" dy="16">notifications from Zephyr power</tspan><tspan x="222" dy="16">management</tspan></text>
<text class="badge-text badge-text-green" x="551" y="308" text-anchor="middle"><tspan x="551" dy="0">bridge</tspan></text>
<text class="card-title" x="633" y="336" text-anchor="middle"><tspan x="633" dy="0">ebpf_tracing</tspan></text>
<text class="card-body" x="633" y="365" text-anchor="middle"><tspan x="633" dy="0">choose concrete target</tspan><tspan x="633" dy="16">build ebpf_ctx_thread,</tspan><tspan x="633" dy="16">ebpf_ctx_isr, or ebpf_ctx_idle</tspan></text>
<text class="badge-text badge-text-green" x="551" y="492" text-anchor="middle"><tspan x="551" dy="0">bridge</tspan></text>
<text class="card-title" x="633" y="520" text-anchor="middle"><tspan x="633" dy="0">ebpf_pm</tspan></text>
<text class="card-body" x="633" y="549" text-anchor="middle"><tspan x="633" dy="0">choose PM target</tspan><tspan x="633" dy="16">build ebpf_ctx_pm</tspan></text>
<text class="badge-text badge-text-blue" x="987.4" y="304" text-anchor="middle"><tspan x="987.4" dy="0">common model</tspan></text>
<text class="card-title" x="1026" y="332" text-anchor="middle"><tspan x="1026" dy="0">Concrete target</tspan></text>
<text class="card-body" x="1026" y="361" text-anchor="middle"><tspan x="1026" dy="0">backend + point</tspan><tspan x="1026" dy="16">runtime dispatch key</tspan></text>
<text class="badge-text badge-text-blue" x="1233.4" y="304" text-anchor="middle"><tspan x="1233.4" dy="0">common model</tspan></text>
<text class="card-title" x="1274" y="332" text-anchor="middle"><tspan x="1274" dy="0">Typed context</tspan></text>
<text class="card-body" x="1274" y="361" text-anchor="middle"><tspan x="1274" dy="0">one backend-defined</tspan><tspan x="1274" dy="16">struct</tspan><tspan x="1274" dy="16">passed to the VM in R1</tspan></text>
<text class="badge-text badge-text-blue" x="1101" y="598" text-anchor="middle"><tspan x="1101" dy="0">shared hub</tspan></text>
<text class="card-title" x="1153" y="626" text-anchor="middle"><tspan x="1153" dy="0">Dispatch runtime</tspan></text>
<text class="card-body" x="1153" y="655" text-anchor="middle"><tspan x="1153" dy="0">immutable snapshot lookup</tspan><tspan x="1153" dy="16">fan-out to enabled</tspan><tspan x="1153" dy="16">sessions</tspan></text>
<text class="note-title" x="954" y="434" text-anchor="start"><tspan x="954" dy="0">Design rule for new backends</tspan></text>
<text class="note-body" x="954" y="462" text-anchor="start"><tspan x="954" dy="0">Translate once into target plus context, then reuse the</tspan><tspan x="954" dy="16">common runtime.</tspan><tspan x="954" dy="16">Do not build a backend-specific verifier, VM path, or</tspan><tspan x="954" dy="16">side execution model.</tspan></text>
<text class="caption" x="740" y="726" text-anchor="middle"><tspan x="740" dy="0">This split is what keeps the system understandable: backend-specific capture on the left, shared runtime semantics on the right.</tspan></text>
<rect class="label-bubble label-bubble-sand" x="333" y="406" width="186" height="28" rx="14" ry="14" />
<rect class="label-bubble label-bubble-green" x="770" y="622" width="164" height="28" rx="14" ry="14" />
<rect class="label-bubble label-bubble-blue" x="1175" y="378" width="194" height="28" rx="14" ry="14" />
<text class="label-bubble-text" x="426" y="425" text-anchor="middle"><tspan x="426" dy="0">native callback arguments</tspan></text>
<text class="label-bubble-text" x="852" y="641" text-anchor="middle"><tspan x="852" dy="0">bridge chooses target</tspan></text>
<text class="label-bubble-text" x="1272" y="397" text-anchor="middle"><tspan x="1272" dy="0">common runtime starts here</tspan></text>
</svg>