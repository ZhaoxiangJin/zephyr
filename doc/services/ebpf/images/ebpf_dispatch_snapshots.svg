<rect class="label-bubble label-bubble-blue" x="581" y="414" width="126" height="28" rx="14" ry="14" />
<rect class="label-bubble label-bubble-slate" x="1106" y="440" width="164" height="28" rx="14" ry="14" />
<text class="label-bubble-text" x="360" y="305" text-anchor="middle"><tspan x="360" dy="0">capture pointer</tspan></text>
<text class="label-bubble-text" x="630" y="395" text-anchor="middle"><tspan x="630" dy="0">reader-visible state</tspan></text>
<text class="label-bubble-text" x="588" y="701" text-anchor="middle"><tspan x="588" dy="0">copy then edit</tspan></text>
<text class="label-bubble-text" x="644" y="433" text-anchor="middle"><tspan x="644" dy="0">atomic publish</tspan></text>
<text class="label-bubble-text" x="1188" y="459" text-anchor="middle"><tspan x="1188" dy="0">sync disable waits here</tspan></text>
</svg>