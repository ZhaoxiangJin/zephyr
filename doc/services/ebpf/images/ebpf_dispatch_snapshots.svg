<text class="headline" x="52" y="78">Dispatch runtime snapshot publication</text>
<text class="subheadline" x="52" y="110" text-anchor="start"><tspan x="52" dy="0">The event path reads one immutable snapshot while the control path prepares the alternate buffer. Publication is a pointer swap, not an</tspan><tspan x="52" dy="18">in-place edit.</tspan></text>
<text class="panel-title" x="70" y="208" text-anchor="start"><tspan x="70" dy="0">Hot event path</tspan></text>
<text class="panel-subtitle" x="70" y="258" text-anchor="start"><tspan x="70" dy="0">Readers stay short: capture the current pointer, increment reader count, iterate the compact attachment list, and execute matching programs.</tspan></text>
<text class="panel-title" x="70" y="480" text-anchor="start"><tspan x="70" dy="0">Control-plane update path</tspan></text>
<text class="panel-subtitle" x="70" y="530" text-anchor="start"><tspan x="70" dy="0">Enable, disable, and unload operations build the next snapshot off-path, then publish it atomically when ready.</tspan></text>
<text class="pill-text pill-text-slate" x="843" y="209" text-anchor="middle"><tspan x="843" dy="0">two preallocated buffers per target</tspan></text>
<text class="badge-text badge-text-green" x="153" y="284" text-anchor="middle"><tspan x="153" dy="0">reader</tspan></text>
<text class="card-title" x="192" y="312" text-anchor="middle"><tspan x="192" dy="0">Backend event</tspan></text>
<text class="card-body" x="192" y="341" text-anchor="middle"><tspan x="192" dy="0">target + typed ctx</tspan><tspan x="192" dy="16">synchronous callback</tspan></text>
<text class="badge-text badge-text-green" x="487" y="284" text-anchor="middle"><tspan x="487" dy="0">reader</tspan></text>
<text class="card-title" x="535" y="312" text-anchor="middle"><tspan x="535" dy="0">current_snapshot</tspan></text>
<text class="card-body" x="535" y="341" text-anchor="middle"><tspan x="535" dy="0">atomic pointer</tspan><tspan x="535" dy="16">one target at a time</tspan></text>
<text class="badge-text badge-text-green" x="812.35" y="256" text-anchor="middle"><tspan x="812.35" dy="0">buffer A or B</tspan></text>
<text class="card-title" x="877" y="284" text-anchor="middle"><tspan x="877" dy="0">Active snapshot</tspan></text>
<text class="card-body" x="877" y="313" text-anchor="middle"><tspan x="877" dy="0">attachments[]</tspan><tspan x="877" dy="16">reader count</tspan><tspan x="877" dy="16">visible to the hot path</tspan></text>
<text class="badge-text badge-text-green" x="1193" y="274" text-anchor="middle"><tspan x="1193" dy="0">execution</tspan></text>
<text class="card-title" x="1244" y="302" text-anchor="middle"><tspan x="1244" dy="0">VM fan-out</tspan></text>
<text class="card-body" x="1244" y="331" text-anchor="middle"><tspan x="1244" dy="0">one invocation per</tspan><tspan x="1244" dy="16">enabled entry</tspan><tspan x="1244" dy="16">fresh stack and registers</tspan></text>
<text class="badge-text badge-text-blue" x="153" y="578" text-anchor="middle"><tspan x="153" dy="0">writer</tspan></text>
<text class="card-title" x="201" y="606" text-anchor="middle"><tspan x="201" dy="0">Control update</tspan></text>
<text class="card-body" x="201" y="635" text-anchor="middle"><tspan x="201" dy="0">lock target</tspan><tspan x="201" dy="16">copy active state into</tspan><tspan x="201" dy="16">alternate buffer</tspan></text>
<text class="badge-text badge-text-blue" x="630.35" y="566" text-anchor="middle"><tspan x="630.35" dy="0">buffer A or B</tspan></text>
<text class="card-title" x="695" y="594" text-anchor="middle"><tspan x="695" dy="0">Alternate snapshot</tspan></text>
<text class="card-body" x="695" y="623" text-anchor="middle"><tspan x="695" dy="0">edit attachment array</tspan><tspan x="695" dy="16">prepare next published view</tspan></text>
<text class="badge-text badge-text-slate" x="1149" y="566" text-anchor="middle"><tspan x="1149" dy="0">drain</tspan></text>
<text class="card-title" x="1214" y="594" text-anchor="middle"><tspan x="1214" dy="0">Retired snapshot</tspan></text>
<text class="card-body" x="1214" y="623" text-anchor="middle"><tspan x="1214" dy="0">old reader-visible state</tspan><tspan x="1214" dy="16">wait only when quiescence</tspan><tspan x="1214" dy="16">matters</tspan></text>
<text class="note-title" x="344" y="550" text-anchor="start"><tspan x="344" dy="0">Why not edit in place?</tspan></text>
<text class="note-body" x="344" y="578" text-anchor="start"><tspan x="344" dy="0">Readers would observe</tspan><tspan x="344" dy="16">half-written state and</tspan><tspan x="344" dy="16">race enable or unload.</tspan><tspan x="344" dy="16">Snapshots keep event</tspan><tspan x="344" dy="16">delivery deterministic.</tspan></text>
<text class="note-title" x="878" y="590" text-anchor="start"><tspan x="878" dy="0">Publish step</tspan></text>
<text class="note-body" x="878" y="618" text-anchor="start"><tspan x="878" dy="0">A single atomic</tspan><tspan x="878" dy="16">pointer swap makes the</tspan><tspan x="878" dy="16">next snapshot visible.</tspan><tspan x="878" dy="16">Readers already in</tspan><tspan x="878" dy="16">flight keep using the</tspan><tspan x="878" dy="16">old one.</tspan></text>
<text class="caption" x="740" y="756" text-anchor="middle"><tspan x="740" dy="0">This is the core hot-path guarantee: readers see a compact immutable list, writers prepare the next list somewhere else.</tspan></text>
<rect class="label-bubble label-bubble-green" x="297" y="286" width="126" height="28" rx="14" ry="14" />
<rect class="label-bubble label-bubble-green" x="559" y="376" width="142" height="28" rx="14" ry="14" />
