<text class="headline" x="52" y="76">Loader pipeline and transaction boundary</text>
<text class="subheadline" x="52" y="108" text-anchor="start"><tspan x="52" dy="0">Loading is intentionally more than parsing bytes: the loader validates, resolves, instantiates, and only then exposes one named</tspan><tspan x="52" dy="18">handle to the rest of the system.</tspan></text>
<text class="panel-title" x="70" y="198" text-anchor="start"><tspan x="70" dy="0">Serialized input</tspan></text>
<text class="panel-subtitle" x="70" y="248" text-anchor="start"><tspan x="70" dy="0">A compact bundle image</tspan><tspan x="70" dy="17">carries bytecode, maps,</tspan><tspan x="70" dy="17">relocation metadata, names,</tspan><tspan x="70" dy="17">and optional</tspan><tspan x="70" dy="17">authentication.</tspan></text>
<text class="panel-title" x="342" y="198" text-anchor="start"><tspan x="342" dy="0">Load transaction</tspan></text>
<text class="panel-subtitle" x="342" y="248" text-anchor="start"><tspan x="342" dy="0">The loader keeps intermediate runtime state private until the named bundle is coherent and safe to publish.</tspan></text>
<text class="panel-title" x="1234" y="198" text-anchor="start"><tspan x="1234" dy="0">Visible result</tspan></text>
<text class="panel-subtitle" x="1234" y="248" text-anchor="start"><tspan x="1234" dy="0">Only a successful load</tspan><tspan x="1234" dy="17">registers a handle that</tspan><tspan x="1234" dy="17">later control operations</tspan><tspan x="1234" dy="17">can target by name.</tspan></text>
<text class="pill-text pill-text-slate" x="708" y="227" text-anchor="middle"><tspan x="708" dy="0">registry lock window</tspan></text>
<text class="badge-text badge-text-sand" x="135" y="324" text-anchor="middle"><tspan x="135" dy="0">input bytes</tspan></text>
<text class="card-title" x="168" y="352" text-anchor="middle"><tspan x="168" dy="0">Bundle image v2</tspan></text>
<text class="card-body" x="168" y="381" text-anchor="middle"><tspan x="168" dy="0">code, maps, relocs</tspan><tspan x="168" dy="16">name, auth</tspan></text>
<text class="badge-text badge-text-blue" x="433" y="274" text-anchor="middle"><tspan x="433" dy="0">gate 1</tspan></text>
<text class="card-title" x="480" y="302" text-anchor="middle"><tspan x="480" dy="0">Validate image</tspan></text>
<text class="card-body" x="480" y="331" text-anchor="middle"><tspan x="480" dy="0">header, ranges</tspan><tspan x="480" dy="16">auth block before</tspan><tspan x="480" dy="16">objects</tspan></text>
<text class="badge-text badge-text-blue" x="705" y="274" text-anchor="middle"><tspan x="705" dy="0">gate 2</tspan></text>
<text class="card-title" x="752" y="302" text-anchor="middle"><tspan x="752" dy="0">Resolve names</tspan></text>
<text class="card-body" x="752" y="331" text-anchor="middle"><tspan x="752" dy="0">bundle name uniqueness</tspan><tspan x="752" dy="16">stable hooks to targets</tspan></text>
<text class="badge-text badge-text-blue" x="463" y="482" text-anchor="middle"><tspan x="463" dy="0">objects</tspan></text>
<text class="card-title" x="511" y="510" text-anchor="middle"><tspan x="511" dy="0">Create maps</tspan></text>
<text class="card-body" x="511" y="539" text-anchor="middle"><tspan x="511" dy="0">runtime IDs</tspan><tspan x="511" dy="16">bundle-owned state</tspan><tspan x="511" dy="16">objects</tspan></text>
<text class="badge-text badge-text-blue" x="721" y="482" text-anchor="middle"><tspan x="721" dy="0">fixups</tspan></text>
<text class="card-title" x="769" y="510" text-anchor="middle"><tspan x="769" dy="0">Apply relocations</tspan></text>
<text class="card-body" x="769" y="539" text-anchor="middle"><tspan x="769" dy="0">patch instruction streams</tspan><tspan x="769" dy="16">map references become</tspan><tspan x="769" dy="16">runtime IDs</tspan></text>
<text class="badge-text badge-text-blue" x="983" y="376" text-anchor="middle"><tspan x="983" dy="0">objects</tspan></text>
<text class="card-title" x="1031" y="404" text-anchor="middle"><tspan x="1031" dy="0">Create attachments</tspan></text>
<text class="card-body" x="1031" y="433" text-anchor="middle"><tspan x="1031" dy="0">bundle-owned programs</tspan><tspan x="1031" dy="16">attach to resolved</tspan><tspan x="1031" dy="16">targets</tspan></text>
<text class="badge-text badge-text-blue" x="741" y="626" text-anchor="middle"><tspan x="741" dy="0">assemble</tspan></text>
<text class="card-title" x="789" y="654" text-anchor="middle"><tspan x="789" dy="0">Runtime bundle</tspan></text>
<text class="card-body" x="789" y="683" text-anchor="middle"><tspan x="789" dy="0">coherent set of maps +</tspan><tspan x="789" dy="16">attachments</tspan></text>
<text class="badge-text badge-text-slate" x="1299" y="312" text-anchor="middle"><tspan x="1299" dy="0">published</tspan></text>
<text class="card-title" x="1332" y="340" text-anchor="middle"><tspan x="1332" dy="0">Named handle</tspan></text>
<text class="card-body" x="1332" y="369" text-anchor="middle"><tspan x="1332" dy="0">registry entry</tspan><tspan x="1332" dy="16">flags, status</tspan></text>
<text class="badge-text badge-text-slate" x="1299" y="496" text-anchor="middle"><tspan x="1299" dy="0">after load</tspan></text>
<text class="card-title" x="1332" y="524" text-anchor="middle"><tspan x="1332" dy="0">Later control</tspan></text>
<text class="card-body" x="1332" y="553" text-anchor="middle"><tspan x="1332" dy="0">enable, disable,</tspan><tspan x="1332" dy="16">unload</tspan><tspan x="1332" dy="16">status by name</tspan></text>
<text class="note-title" x="388" y="628" text-anchor="start"><tspan x="388" dy="0">Failure semantics</tspan></text>
<text class="note-body" x="388" y="656" text-anchor="start"><tspan x="388" dy="0">Any error tears down partially</tspan><tspan x="388" dy="16">created maps and attachments.</tspan><tspan x="388" dy="16">The named handle stays invisible</tspan><tspan x="388" dy="16">until the whole bundle is coherent.</tspan></text>
<text class="note-title" x="948" y="590" text-anchor="start"><tspan x="948" dy="0">Why hold the lock so long?</tspan></text>
<text class="note-body" x="948" y="618" text-anchor="start"><tspan x="948" dy="0">Duplicate-name rejection</tspan><tspan x="948" dy="16">and final registration</tspan><tspan x="948" dy="16">share one lock window.</tspan><tspan x="948" dy="16">That closes the race</tspan><tspan x="948" dy="16">between checking and</tspan><tspan x="948" dy="16">publishing the handle.</tspan></text>
<text class="caption" x="790" y="784" text-anchor="middle"><tspan x="790" dy="0">The important architectural boundary is publication, not parsing: partial runtime objects never escape the transaction.</tspan></text>
<rect class="label-bubble label-bubble-sand" x="397" y="356" width="166" height="28" rx="14" ry="14" />
<rect class="label-bubble label-bubble-slate" x="647" y="356" width="210" height="28" rx="14" ry="14" />
<rect class="label-bubble label-bubble-blue" x="641.8" y="562" width="236.4" height="28" rx="14" ry="14" />
<rect class="label-bubble label-bubble-slate" x="1252" y="638" width="160" height="28" rx="14" ry="14" />
<rect class="label-bubble label-bubble-rose" x="721" y="716" width="138" height="28" rx="14" ry="14" />
<text class="label-bubble-text" x="480" y="375" text-anchor="middle"><tspan x="480" dy="0">auth + structural checks</tspan></text>
<text class="label-bubble-text" x="752" y="375" text-anchor="middle"><tspan x="752" dy="0">name reservation + hook lookup</tspan></text>
<text class="label-bubble-text" x="760" y="581" text-anchor="middle"><tspan x="760" dy="0">map references become runtime fixups</tspan></text>
<text class="label-bubble-text" x="1332" y="657" text-anchor="middle"><tspan x="1332" dy="0">becomes visible here</tspan></text>
<text class="label-bubble-text" x="790" y="735" text-anchor="middle"><tspan x="790" dy="0">rollback on error</tspan></text>
</svg>