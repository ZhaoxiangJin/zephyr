<text class="headline" x="52" y="82">PM residency profiler: entry, exit, and reporting flow</text>
<text class="subheadline" x="52" y="114" text-anchor="start"><tspan x="52" dy="0">The runtime-loaded PM bundle carries two programs: pm_entry timestamps each state entry and counts it, while pm_exit accumulates elapsed residency for</tspan><tspan x="52" dy="18">the state being exited.</tspan></text>
<text class="panel-title" x="66" y="186" text-anchor="start"><tspan x="66" dy="0">Bundle preparation</tspan></text>
<text class="panel-subtitle" x="66" y="236" text-anchor="start"><tspan x="66" dy="0">One restricted-C probe pair becomes one</tspan><tspan x="66" dy="17">embedded runtime bundle that the sample</tspan><tspan x="66" dy="17">loads and enables at startup.</tspan></text>
<text class="panel-title" x="428" y="186" text-anchor="start"><tspan x="428" dy="0">PM backend event handling</tspan></text>
<text class="panel-subtitle" x="428" y="236" text-anchor="start"><tspan x="428" dy="0">The PM backend translates entry and exit callbacks into ebpf_ctx_pm</tspan><tspan x="428" dy="17">sessions. Each eBPF program updates a different piece of shared</tspan><tspan x="428" dy="17">measurement state.</tspan></text>
<text class="panel-title" x="428" y="538" text-anchor="start"><tspan x="428" dy="0">Runtime-owned measurement maps</tspan></text>
<text class="panel-subtitle" x="428" y="588" text-anchor="start"><tspan x="428" dy="0">The probe keeps one timestamp map for internal bookkeeping and</tspan><tspan x="428" dy="17">exposes per-state counts and accumulated residency through normal map</tspan><tspan x="428" dy="17">reads.</tspan></text>
<text class="panel-title" x="1000" y="186" text-anchor="start"><tspan x="1000" dy="0">Application reporting loop</tspan></text>
<text class="panel-subtitle" x="1000" y="236" text-anchor="start"><tspan x="1000" dy="0">The sample changes its worker sleep window over time, then reads</tspan><tspan x="1000" dy="17">entry_count_map and residency_map and prints per-state totals for</tspan><tspan x="1000" dy="17">each interval.</tspan></text>
<text class="badge-text badge-text-sand" x="158.15" y="274" text-anchor="middle"><tspan x="158.15" dy="0">host-built bundle</tspan></text>
<text class="card-title" x="209" y="302" text-anchor="middle"><tspan x="209" dy="0">pm_entry + pm_exit</tspan></text>
<text class="card-body" x="209" y="331" text-anchor="middle"><tspan x="209" dy="0">restricted-C PM probe pair</tspan><tspan x="209" dy="16">west ebpf build -&gt;</tspan><tspan x="209" dy="16">pm_residency.bundle</tspan></text>
<text class="badge-text badge-text-sand" x="141" y="394" text-anchor="middle"><tspan x="141" dy="0">startup</tspan></text>
<text class="card-title" x="209" y="422" text-anchor="middle"><tspan x="209" dy="0">ebpf_loader_load + enable</tspan></text>
<text class="card-body" x="209" y="451" text-anchor="middle"><tspan x="209" dy="0">pm_residency_probe</tspan><tspan x="209" dy="16">runtime-loaded PM probe</tspan><tspan x="209" dy="16">enabled</tspan></text>
<text class="badge-text badge-text-blue" x="501" y="266" text-anchor="middle"><tspan x="501" dy="0">entry event</tspan></text>
<text class="card-title" x="520" y="294" text-anchor="middle"><tspan x="520" dy="0">pm/state_entry</tspan></text>
<text class="card-body" x="520" y="323" text-anchor="middle"><tspan x="520" dy="0">PM notifier</tspan><tspan x="520" dy="16">callback</tspan><tspan x="520" dy="16">one concrete</tspan><tspan x="520" dy="16">state</tspan></text>
<text class="badge-text badge-text-blue" x="706.35" y="254" text-anchor="middle"><tspan x="706.35" dy="0">entry program</tspan></text>
<text class="card-title" x="764" y="282" text-anchor="middle"><tspan x="764" dy="0">pm_entry()</tspan></text>
<text class="card-body" x="764" y="311" text-anchor="middle"><tspan x="764" dy="0">record entry_ts_map[state] =</tspan><tspan x="764" dy="16">now</tspan><tspan x="764" dy="16">increment</tspan><tspan x="764" dy="16">entry_count_map[state]</tspan></text>
<text class="badge-text badge-text-blue" x="501" y="400" text-anchor="middle"><tspan x="501" dy="0">exit event</tspan></text>
<text class="card-title" x="520" y="428" text-anchor="middle"><tspan x="520" dy="0">pm/state_exit</tspan></text>
<text class="card-body" x="520" y="457" text-anchor="middle"><tspan x="520" dy="0">PM notifier</tspan><tspan x="520" dy="16">callback</tspan><tspan x="520" dy="16">same state key</tspan><tspan x="520" dy="16">on exit</tspan></text>
<text class="badge-text badge-text-blue" x="703.4" y="388" text-anchor="middle"><tspan x="703.4" dy="0">exit program</tspan></text>
<text class="card-title" x="764" y="416" text-anchor="middle"><tspan x="764" dy="0">pm_exit()</tspan></text>
<text class="card-body" x="764" y="445" text-anchor="middle"><tspan x="764" dy="0">load entry_ts_map[state]</tspan><tspan x="764" dy="16">add elapsed ns into</tspan><tspan x="764" dy="16">residency_map[state]</tspan></text>
<text class="badge-text badge-text-green" x="501" y="650" text-anchor="middle"><tspan x="501" dy="0">runtime map</tspan></text>
<text class="card-title" x="516" y="678" text-anchor="middle"><tspan x="516" dy="0">entry_ts_map</tspan></text>
<text class="card-body" x="516" y="707" text-anchor="middle"><tspan x="516" dy="0">internal start</tspan><tspan x="516" dy="16">timestamp</tspan><tspan x="516" dy="16">per PM state</tspan></text>
<text class="badge-text badge-text-green" x="661" y="650" text-anchor="middle"><tspan x="661" dy="0">runtime map</tspan></text>
<text class="card-title" x="680" y="678" text-anchor="middle"><tspan x="680" dy="0">entry_count_map</tspan></text>
<text class="card-body" x="680" y="707" text-anchor="middle"><tspan x="680" dy="0">entry count per</tspan><tspan x="680" dy="16">state</tspan></text>
<text class="badge-text badge-text-green" x="829" y="650" text-anchor="middle"><tspan x="829" dy="0">runtime map</tspan></text>
<text class="card-title" x="844" y="678" text-anchor="middle"><tspan x="844" dy="0">residency_map</tspan></text>
<text class="card-body" x="844" y="707" text-anchor="middle"><tspan x="844" dy="0">accumulated ns</tspan><tspan x="844" dy="16">per state</tspan></text>
<text class="badge-text badge-text-rose" x="1073" y="266" text-anchor="middle"><tspan x="1073" dy="0">stimulus</tspan></text>
<text class="card-title" x="1236" y="294" text-anchor="middle"><tspan x="1236" dy="0">phase loop</tspan></text>
<text class="card-body" x="1236" y="323" text-anchor="middle"><tspan x="1236" dy="0">10 ms -&gt; 50 ms -&gt; 200 ms -&gt; 1000 ms</tspan><tspan x="1236" dy="16">longer idle windows let PM policy choose deeper states</tspan></text>
<text class="badge-text badge-text-rose" x="1073" y="464" text-anchor="middle"><tspan x="1073" dy="0">normal code</tspan></text>
<text class="card-title" x="1121" y="492" text-anchor="middle"><tspan x="1121" dy="0">map lookups</tspan></text>
<text class="card-body" x="1121" y="521" text-anchor="middle"><tspan x="1121" dy="0">read entry_count_map</tspan><tspan x="1121" dy="16">read residency_map</tspan></text>
<text class="badge-text badge-text-rose" x="1327.3" y="464" text-anchor="middle"><tspan x="1327.3" dy="0">console output</tspan></text>
<text class="card-title" x="1359" y="492" text-anchor="middle"><tspan x="1359" dy="0">phase report</tspan></text>
<text class="card-body" x="1359" y="521" text-anchor="middle"><tspan x="1359" dy="0">entries, residency ms</tspan><tspan x="1359" dy="16">interval percentage</tspan><tspan x="1359" dy="16">per state</tspan></text>
<text class="note-title" x="1032" y="600" text-anchor="start"><tspan x="1032" dy="0">What the sample proves</tspan></text>
<text class="note-body" x="1032" y="628" text-anchor="start"><tspan x="1032" dy="0">The probe's own timestamp map stays internal, while normal</tspan><tspan x="1032" dy="16">application code reads the exported count and residency</tspan><tspan x="1032" dy="16">maps.</tspan><tspan x="1032" dy="16">As the worker sleep interval grows, the printed report</tspan><tspan x="1032" dy="16">shows whether deeper PM states are actually reached.</tspan></text>
<text class="badge-text badge-text-rose" x="1195" y="772" text-anchor="middle"><tspan x="1195" dy="0">teardown</tspan></text>
<text class="card-title" x="1236" y="800" text-anchor="middle"><tspan x="1236" dy="0">disable + unload</tspan></text>
<text class="card-body" x="1236" y="829" text-anchor="middle"><tspan x="1236" dy="0">remove PM session</tspan><tspan x="1236" dy="16">destroy runtime-owned</tspan><tspan x="1236" dy="16">state coherently</tspan></text>
<text class="caption" x="770" y="880" text-anchor="middle"><tspan x="770" dy="0">This diagram is the PM sample's key narrative: one runtime bundle listens on PM entry and exit, records per-state timing, and lets normal code report what the platform PM policy really did.</tspan></text>
