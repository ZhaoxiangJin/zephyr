<text class="label-bubble-text" x="1120" y="383" text-anchor="middle"><tspan x="1120" dy="0">phase changes idle window</tspan></text>
<text class="label-bubble-text" x="1340" y="403" text-anchor="middle"><tspan x="1340" dy="0">entries and residency per phase</tspan></text>
</svg>