  </defs>
  <rect class="bg" x="0" y="0" width="1340" height="810" rx="24" ry="24" />
  <rect class="frame" x="12" y="12" width="1316" height="786" rx="20" ry="20" />
  <rect class="panel panel-blue" x="52" y="170" width="920" height="590" rx="28" ry="28" />
<line class="panel-divider" x1="52" y1="234" x2="972" y2="234" />
