<text class="label-bubble-text" x="676" y="489" text-anchor="middle"><tspan x="676" dy="0">runtime-owned map handle</tspan></text>
<text class="label-bubble-text" x="810" y="539" text-anchor="middle"><tspan x="810" dy="0">attachment becomes live</tspan></text>
<text class="label-bubble-text" x="1110" y="589" text-anchor="middle"><tspan x="1110" dy="0">read from normal code</tspan></text>
</svg>