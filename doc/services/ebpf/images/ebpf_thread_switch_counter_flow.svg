<text class="headline" x="52" y="82">Thread-switch counter: end-to-end flow</text>
<text class="subheadline" x="52" y="114" text-anchor="start"><tspan x="52" dy="0">One host-built runtime bundle becomes one enabled tracing session. The probe increments counter_map on kernel/thread_switched_in, and normal</tspan><tspan x="52" dy="18">Zephyr code reads that map back out.</tspan></text>
<text class="panel-title" x="66" y="186" text-anchor="start"><tspan x="66" dy="0">Host-built input</tspan></text>
<text class="panel-subtitle" x="66" y="236" text-anchor="start"><tspan x="66" dy="0">The sample starts from one restricted-C</tspan><tspan x="66" dy="17">probe and embeds the resulting bundle</tspan><tspan x="66" dy="17">bytes into the application image.</tspan></text>
<text class="panel-title" x="428" y="186" text-anchor="start"><tspan x="428" dy="0">Runtime control path</tspan></text>
<text class="panel-subtitle" x="428" y="236" text-anchor="start"><tspan x="428" dy="0">Loader operations instantiate one named bundle, keep a</tspan><tspan x="428" dy="17">stable map name, and enable the attachment only after the handle is</tspan><tspan x="428" dy="17">coherent.</tspan></text>
<text class="panel-title" x="428" y="538" text-anchor="start"><tspan x="428" dy="0">Tracing event path</tspan></text>
<text class="panel-subtitle" x="428" y="588" text-anchor="start"><tspan x="428" dy="0">Once enabled, scheduler callbacks enter through one stable hook name</tspan><tspan x="428" dy="17">and the eBPF program updates the shared counter map on each thread</tspan><tspan x="428" dy="17">switch.</tspan></text>
<text class="panel-title" x="1000" y="186" text-anchor="start"><tspan x="1000" dy="0">Application-side observation</tspan></text>
<text class="panel-subtitle" x="1000" y="236" text-anchor="start"><tspan x="1000" dy="0">The sample's own worker thread forces scheduler activity, reads</tspan><tspan x="1000" dy="17">counter_map once per second through named loader helpers, then</tspan><tspan x="1000" dy="17">disables and unloads the bundle by name.</tspan></text>
<text class="badge-text badge-text-sand" x="143.4" y="274" text-anchor="middle"><tspan x="143.4" dy="0">restricted C</tspan></text>
<text class="card-title" x="209" y="302" text-anchor="middle"><tspan x="209" dy="0">thread_switch_counter.c</tspan></text>
<text class="card-body" x="209" y="331" text-anchor="middle"><tspan x="209" dy="0">EBPF_PROGRAM_SCHED</tspan><tspan x="209" dy="16">kernel/thread_switched_in</tspan><tspan x="209" dy="16">counter_map array probe</tspan></text>
<text class="badge-text badge-text-sand" x="143.4" y="394" text-anchor="middle"><tspan x="143.4" dy="0">bundle bytes</tspan></text>
<text class="card-title" x="209" y="422" text-anchor="middle"><tspan x="209" dy="0">thread_switch_probe_bundle[]</tspan></text>
<text class="card-body" x="209" y="451" text-anchor="middle"><tspan x="209" dy="0">west ebpf build output</tspan><tspan x="209" dy="16">embedded loader image bytes</tspan></text>
<text class="badge-text badge-text-blue" x="501" y="266" text-anchor="middle"><tspan x="501" dy="0">step 1</tspan></text>
<text class="card-title" x="547" y="294" text-anchor="middle"><tspan x="547" dy="0">ebpf_loader_load</tspan></text>
<text class="card-body" x="547" y="323" text-anchor="middle"><tspan x="547" dy="0">parse bundle image</tspan><tspan x="547" dy="16">instantiate runtime</tspan><tspan x="547" dy="16">objects</tspan></text>
<text class="badge-text badge-text-blue" x="761.4" y="266" text-anchor="middle"><tspan x="761.4" dy="0">named handle</tspan></text>
<text class="card-title" x="805" y="294" text-anchor="middle"><tspan x="805" dy="0">thread_switch_probe</tspan></text>
<text class="card-body" x="805" y="323" text-anchor="middle"><tspan x="805" dy="0">named runtime bundle</tspan><tspan x="805" dy="16">bundle + attachment</tspan><tspan x="805" dy="16">lifetime owner</tspan></text>
<text class="badge-text badge-text-blue" x="501" y="390" text-anchor="middle"><tspan x="501" dy="0">step 2</tspan></text>
<text class="card-title" x="547" y="418" text-anchor="middle"><tspan x="547" dy="0">name counter_map</tspan></text>
<text class="card-body" x="547" y="447" text-anchor="middle"><tspan x="547" dy="0">stable map name</tspan><tspan x="547" dy="16">used by loader lookup</tspan><tspan x="547" dy="16">helpers</tspan></text>
<text class="badge-text badge-text-blue" x="759" y="390" text-anchor="middle"><tspan x="759" dy="0">step 3</tspan></text>
<text class="card-title" x="805" y="418" text-anchor="middle"><tspan x="805" dy="0">ebpf_loader_enable</tspan></text>
<text class="card-body" x="805" y="447" text-anchor="middle"><tspan x="805" dy="0">verify current session</tspan><tspan x="805" dy="16">publish enabled</tspan><tspan x="805" dy="16">attachment</tspan></text>
<text class="badge-text badge-text-green" x="503.4" y="640" text-anchor="middle"><tspan x="503.4" dy="0">event source</tspan></text>
<text class="card-title" x="517" y="668" text-anchor="middle"><tspan x="517" dy="0">kernel/thread_</tspan><tspan x="517" dy="19">switched_in</tspan></text>
<text class="card-body" x="517" y="716" text-anchor="middle"><tspan x="517" dy="0">stable tracing</tspan><tspan x="517" dy="16">hook</tspan><tspan x="517" dy="16">scheduler switch</tspan><tspan x="517" dy="16">callback</tspan></text>
<text class="badge-text badge-text-green" x="675.4" y="610" text-anchor="middle"><tspan x="675.4" dy="0">eBPF program</tspan></text>
<text class="card-title" x="696" y="638" text-anchor="middle"><tspan x="696" dy="0">count_thread_</tspan><tspan x="696" dy="19">switches()</tspan></text>
<text class="card-body" x="696" y="686" text-anchor="middle"><tspan x="696" dy="0">lookup key 0</tspan><tspan x="696" dy="16">increment value by</tspan><tspan x="696" dy="16">1</tspan></text>
<text class="badge-text badge-text-green" x="859" y="640" text-anchor="middle"><tspan x="859" dy="0">shared map</tspan></text>
<text class="card-title" x="854" y="668" text-anchor="middle"><tspan x="854" dy="0">counter_map</tspan></text>
<text class="card-body" x="854" y="697" text-anchor="middle"><tspan x="854" dy="0">array[0]</tspan><tspan x="854" dy="16">shared</tspan><tspan x="854" dy="16">counter</tspan></text>
<text class="badge-text badge-text-rose" x="1073" y="266" text-anchor="middle"><tspan x="1073" dy="0">stimulus</tspan></text>
<text class="card-title" x="1116" y="294" text-anchor="middle"><tspan x="1116" dy="0">worker thread</tspan></text>
<text class="card-body" x="1116" y="323" text-anchor="middle"><tspan x="1116" dy="0">k_msleep(1) loop</tspan><tspan x="1116" dy="16">forces scheduler thread</tspan><tspan x="1116" dy="16">switches</tspan></text>
<text class="note-title" x="1260" y="266" text-anchor="start"><tspan x="1260" dy="0">Why this sample is useful</tspan></text>
<text class="note-body" x="1260" y="294" text-anchor="start"><tspan x="1260" dy="0">It proves that a</tspan><tspan x="1260" dy="16">runtime-loaded tracing</tspan><tspan x="1260" dy="16">probe can update shared</tspan><tspan x="1260" dy="16">state without any shell or</tspan><tspan x="1260" dy="16">static registration path.</tspan><tspan x="1260" dy="16">Normal Zephyr code reads</tspan><tspan x="1260" dy="16">the same counter back</tspan><tspan x="1260" dy="16">through the public loader</tspan><tspan x="1260" dy="16">copy API.</tspan></text>
<text class="badge-text badge-text-rose" x="1073" y="462" text-anchor="middle"><tspan x="1073" dy="0">normal code</tspan></text>
<text class="card-title" x="1121" y="490" text-anchor="middle"><tspan x="1121" dy="0">periodic map lookup</tspan></text>
<text class="card-body" x="1121" y="519" text-anchor="middle"><tspan x="1121" dy="0">ebpf_loader_map_lookup_copy_by_name</tspan><tspan x="1121" dy="16">read counter_map[0] once</tspan><tspan x="1121" dy="16">per second</tspan></text>
<text class="badge-text badge-text-rose" x="1319" y="486" text-anchor="middle"><tspan x="1319" dy="0">output</tspan></text>
<text class="card-title" x="1359" y="514" text-anchor="middle"><tspan x="1359" dy="0">console report</tspan></text>
<text class="card-body" x="1359" y="543" text-anchor="middle"><tspan x="1359" dy="0">count=%u (+delta)</tspan><tspan x="1359" dy="16">human-readable runtime</tspan><tspan x="1359" dy="16">signal</tspan></text>
<text class="badge-text badge-text-rose" x="1195" y="700" text-anchor="middle"><tspan x="1195" dy="0">teardown</tspan></text>
<text class="card-title" x="1236" y="728" text-anchor="middle"><tspan x="1236" dy="0">disable + unload</tspan></text>
<text class="card-body" x="1236" y="757" text-anchor="middle"><tspan x="1236" dy="0">ebpf_loader_disable_by_name</tspan><tspan x="1236" dy="16">ebpf_loader_unload_by_name</tspan></text>
<text class="caption" x="770" y="836" text-anchor="middle"><tspan x="770" dy="0">This is the story the sample demonstrates end to end: host-built bundle, runtime enable, native scheduler events, shared map update, and plain application-side readout.</tspan></text>
