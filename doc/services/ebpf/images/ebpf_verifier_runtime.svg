<text class="label-bubble-text" x="242" y="403" text-anchor="middle"><tspan x="242" dy="0">static structure</tspan></text>
<text class="label-bubble-text" x="238" y="565" text-anchor="middle"><tspan x="238" dy="0">attachment semantics</tspan></text>
<text class="label-bubble-text" x="734" y="453" text-anchor="middle"><tspan x="734" dy="0">policy shared by verifier and VM</tspan></text>
<text class="label-bubble-text" x="1118" y="435" text-anchor="middle"><tspan x="1118" dy="0">runtime recheck</tspan></text>
<text class="label-bubble-text" x="1236" y="449" text-anchor="middle"><tspan x="1236" dy="0">CALL</tspan></text>
</svg>