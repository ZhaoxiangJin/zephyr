<text class="headline" x="52" y="80">Verifier and runtime safety boundary</text>
<text class="subheadline" x="52" y="112" text-anchor="start"><tspan x="52" dy="0">The verifier is not a one-off parser. It establishes the same attachment-aware contract that the VM later enforces for helper use and</tspan><tspan x="52" dy="18">context writes.</tspan></text>
<text class="panel-title" x="70" y="208" text-anchor="start"><tspan x="70" dy="0">Verify-time</tspan></text>
<text class="panel-subtitle" x="70" y="258" text-anchor="start"><tspan x="70" dy="0">Structural checks happen before publication. The result only matters for the</tspan><tspan x="70" dy="17">current attachment session.</tspan></text>
<text class="panel-title" x="738" y="208" text-anchor="start"><tspan x="738" dy="0">Run-time</tspan></text>
<text class="panel-subtitle" x="738" y="258" text-anchor="start"><tspan x="738" dy="0">Once a session is enabled, the VM still consults the same contract so execution cannot</tspan><tspan x="738" dy="17">silently widen policy.</tspan></text>
<text class="pill-text pill-text-green" x="691" y="261" text-anchor="middle"><tspan x="691" dy="0">shared contract hinge</tspan></text>
<text class="badge-text badge-text-sand" x="155" y="314" text-anchor="middle"><tspan x="155" dy="0">input</tspan></text>
<text class="card-title" x="200" y="342" text-anchor="middle"><tspan x="200" dy="0">Program bytecode</tspan></text>
<text class="card-body" x="200" y="371" text-anchor="middle"><tspan x="200" dy="0">instruction stream</tspan><tspan x="200" dy="16">helper IDs and jumps</tspan></text>
<text class="badge-text badge-text-sand" x="155" y="476" text-anchor="middle"><tspan x="155" dy="0">input</tspan></text>
<text class="card-title" x="200" y="504" text-anchor="middle"><tspan x="200" dy="0">Attachment target</tspan></text>
<text class="card-body" x="200" y="533" text-anchor="middle"><tspan x="200" dy="0">prog_type, backend,</tspan><tspan x="200" dy="16">point</tspan><tspan x="200" dy="16">context semantics</tspan></text>
<text class="badge-text badge-text-sand" x="427" y="374" text-anchor="middle"><tspan x="427" dy="0">gate</tspan></text>
<text class="card-title" x="494" y="402" text-anchor="middle"><tspan x="494" dy="0">Verifier</tspan></text>
<text class="card-body" x="494" y="431" text-anchor="middle"><tspan x="494" dy="0">opcode, jump, stack, pointer</tspan><tspan x="494" dy="16">provenance</tspan><tspan x="494" dy="16">helper allowlist, read-only R1</tspan><tspan x="494" dy="16">context</tspan></text>
<text class="badge-text badge-text-green" x="684.35" y="312" text-anchor="middle"><tspan x="684.35" dy="0">shared policy</tspan></text>
<text class="card-title" x="720" y="340" text-anchor="middle"><tspan x="720" dy="0">Contract table</tspan></text>
<text class="card-body" x="720" y="369" text-anchor="middle"><tspan x="720" dy="0">helper allowlist</tspan><tspan x="720" dy="16">context write policy</tspan></text>
<text class="badge-text badge-text-blue" x="891" y="326" text-anchor="middle"><tspan x="891" dy="0">handoff</tspan></text>
<text class="card-title" x="922" y="354" text-anchor="middle"><tspan x="922" dy="0">Verified session</tspan></text>
<text class="card-body" x="922" y="383" text-anchor="middle"><tspan x="922" dy="0">current target +</tspan><tspan x="922" dy="16">session_seq</tspan><tspan x="922" dy="16">safe to publish if</tspan><tspan x="922" dy="16">still current</tspan></text>
<text class="badge-text badge-text-blue" x="1091" y="326" text-anchor="middle"><tspan x="1091" dy="0">execution</tspan></text>
<text class="card-title" x="1142" y="354" text-anchor="middle"><tspan x="1142" dy="0">Interpreter VM</tspan></text>
<text class="card-body" x="1142" y="383" text-anchor="middle"><tspan x="1142" dy="0">fresh stack</tspan><tspan x="1142" dy="16">runtime contract rechecks</tspan></text>
<text class="badge-text badge-text-blue" x="812.35" y="508" text-anchor="middle"><tspan x="812.35" dy="0">runtime input</tspan></text>
<text class="card-title" x="858" y="536" text-anchor="middle"><tspan x="858" dy="0">Event context in R1</tspan></text>
<text class="card-body" x="858" y="565" text-anchor="middle"><tspan x="858" dy="0">backend-defined struct</tspan><tspan x="858" dy="16">read-only or writable by</tspan><tspan x="858" dy="16">contract</tspan></text>
<text class="badge-text badge-text-blue" x="1091" y="496" text-anchor="middle"><tspan x="1091" dy="0">CALL</tspan></text>
<text class="card-title" x="1120" y="524" text-anchor="middle"><tspan x="1120" dy="0">Helpers</tspan></text>
<text class="card-body" x="1120" y="553" text-anchor="middle"><tspan x="1120" dy="0">controlled service</tspan><tspan x="1120" dy="16">entry</tspan></text>
<text class="badge-text badge-text-blue" x="1319" y="496" text-anchor="middle"><tspan x="1319" dy="0">data</tspan></text>
<text class="card-title" x="1328" y="524" text-anchor="middle"><tspan x="1328" dy="0">Maps</tspan></text>
<text class="card-body" x="1328" y="553" text-anchor="middle"><tspan x="1328" dy="0">shared state</tspan></text>
<text class="note-title" x="118" y="620" text-anchor="start"><tspan x="118" dy="0">Why keep the contract table small?</tspan></text>
<text class="note-body" x="118" y="648" text-anchor="start"><tspan x="118" dy="0">Because helper policy and context mutability are architectural</tspan><tspan x="118" dy="16">commitments.</tspan><tspan x="118" dy="16">Adding either is a subsystem design change, not a local verifier</tspan><tspan x="118" dy="16">tweak.</tspan></text>
<text class="note-title" x="1048" y="620" text-anchor="start"><tspan x="1048" dy="0">Runtime backstop</tspan></text>
<text class="note-body" x="1048" y="648" text-anchor="start"><tspan x="1048" dy="0">The VM rechecks helper IDs and context writes</tspan><tspan x="1048" dy="16">against the resolved contract.</tspan><tspan x="1048" dy="16">That preserves the effective policy even if</tspan><tspan x="1048" dy="16">verification logic is incomplete.</tspan></text>
<text class="caption" x="742" y="754" text-anchor="middle"><tspan x="742" dy="0">This is the subsystem's safety story in one sentence: verify once for the session, then keep the same policy alive at runtime.</tspan></text>
