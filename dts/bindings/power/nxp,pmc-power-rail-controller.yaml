description: |
  NXP PMC (Power Management Controller) power-rail controller.

  The PMC owns the SoC power-switch matrix: array / periphery power
  rails for on-chip peripherals (APD / PPD), voltage monitors, body
  bias generators, DSR retention enables and power-mode control for
  the integrated DCDC / LDO regulators.

  A contiguous set of 32-bit ``PDRUNCFGn`` registers holds the enable
  bits. Writing 1 asserts power-down for the selected rail; writing 0
  releases it. ``PDRUNCFGn`` are staging registers: the hardware only
  samples them when software writes ``CTRL.APPLYCFG`` and waits for
  ``STATUS.BUSY`` to clear.

  Consumers request the rails they need through the ``nxp,power-rails``
  phandle-array property. Each specifier is a single controller-local
  identifier that
  linearly addresses the full PDRUNCFGn array as
  ``pdruncfg_index * 32 + bit_within_register``. Named constants for the
  SoC in use are provided in
  ``include/zephyr/dt-bindings/power/nxp_rt7xx_pmc_power.h``.

compatible: "nxp,pmc-power-rail-controller"

include: base.yaml

examples: |
    pmc0: pmc@20f000 {
      compatible = "nxp,pmc-power-rail-controller";
      reg = <0x20f000 0x1000>;
      #power-rail-cells = <1>;
    };

    &lcdif {
      nxp,power-rails = <&pmc0 NXP_RT7XX_PMC_APD_LCDIF>,
                        <&pmc0 NXP_RT7XX_PMC_PPD_LCDIF>;
    };

properties:
  reg:
    required: true

  "#power-rail-cells":
    type: int
    const: 1

power-rail-cells:
  - id
