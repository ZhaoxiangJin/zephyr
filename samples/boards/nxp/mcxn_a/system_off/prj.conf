CONFIG_POWEROFF=y
CONFIG_WUC=y
CONFIG_COUNTER=y
CONFIG_COUNTER_MCUX_LPTMR_ALARM=y

# Portable wakeup-source selection (wakeup_source_enable); the WUC backend arms
# the WUU. CONFIG_INPUT provides the gpio-keys device used by the button branch.
CONFIG_WAKEUP_SOURCE=y
CONFIG_INPUT=y

# The cycle counter is seeded on a cold boot and left untouched on a Deep Power
# Down wake, told apart from the CMC reset cause reported through hwinfo.
CONFIG_HWINFO=y
